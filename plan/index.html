<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>Tu plan de crecimiento. Growth Advisor</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet" />
		<script src="../assets/report.js" defer></script>
		<style>
			:root {
				--accent: #2db3b0;
				--accent-dark: #1f8e8b;
				--ink: #16181a;
				--paper: #fafaf8;
				--muted: #4b4f53;
				--muted-on-dark: rgba(250, 250, 248, 0.68);
				--border: rgba(22, 24, 26, 0.12);
				--white: #ffffff;
				--font: 'Montserrat', sans-serif;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
			}

			body {
				background: var(--paper);
				color: var(--ink);
				font-family: var(--font);
				font-weight: 400;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
			}

			img {
				max-width: 100%;
				display: block;
			}

			h1,
			h2,
			h3 {
				font-family: var(--font);
				margin: 0;
				line-height: 1.15;
			}

			p {
				margin: 0;
			}

			.wrap {
				max-width: 720px;
				margin: 0 auto;
				padding: 0 20px;
			}

			/* ---------- Franja del logo ---------- */

			.logo-strip {
				background: var(--ink);
				padding: 6px 0;
			}

			.logo-strip .wrap {
				display: flex;
				justify-content: center;
			}

			.logo {
				height: 84px;
				width: auto;
			}

			@media (min-width: 720px) {
				.logo {
					height: 116px;
				}
			}

			/* ---------- Contenido ---------- */

			.page-wrap {
				max-width: 720px;
				margin: 0 auto;
				padding: 40px 20px 64px;
			}

			.state {
				text-align: center;
				padding: 60px 10px;
			}

			.state[hidden] {
				display: none;
			}

			.state p {
				font-weight: 700;
				font-size: 1.05rem;
			}

			.state .sub {
				font-weight: 400;
				font-size: 0.9rem;
				color: var(--muted);
				margin-top: 8px;
			}

			.spinner {
				width: 44px;
				height: 44px;
				border: 4px solid rgba(45, 179, 176, 0.2);
				border-top-color: var(--accent);
				border-radius: 50%;
				margin: 0 auto 20px;
				animation: spin 0.9s linear infinite;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			/* ---------- Reporte (mismo look que index.html) ---------- */

			.report-block {
				background: var(--white);
				border: 1px solid var(--border);
				border-radius: 14px;
				padding: 20px;
				margin-bottom: 14px;
			}

			.report-block h2 {
				font-family: var(--font);
				font-weight: 800;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--accent);
				font-size: 0.75rem;
				margin: 0 0 10px;
			}

			.report-block p {
				margin: 0;
				white-space: pre-line;
				font-size: 0.98rem;
			}

			.report-note {
				font-size: 0.82rem;
				color: var(--muted);
				margin-bottom: 16px;
			}

			.closing-block {
				background: var(--ink);
				color: var(--paper);
				border-radius: 16px;
				padding: 26px 20px;
				margin-top: 22px;
			}

			.closing-block p {
				margin: 0 0 16px;
				font-size: 0.98rem;
			}

			.closing-block p:last-of-type {
				margin-bottom: 0;
			}

			.closing-block .weeks {
				color: var(--accent);
				font-weight: 700;
			}

			.closing-block .signature {
				color: var(--paper);
			}

			.closing-cta {
				display: block;
				text-align: center;
				background: var(--accent);
				color: var(--white);
				font-weight: 700;
				font-size: 1.05rem;
				text-decoration: none;
				border: none;
				border-radius: 12px;
				padding: 18px;
				margin-top: 22px;
				cursor: pointer;
			}

			.closing-cta:hover,
			.closing-cta:focus-visible {
				background: var(--accent-dark);
				color: var(--white);
			}

			.fx-note {
				font-size: 0.78rem;
				color: var(--muted-on-dark);
				margin-top: 16px;
			}

			/* Boton secundario: mismo tamano que el de agendar, pero contorno para que la
			   jerarquia visual quede clara (agendar es la accion principal). */
			.pdf-btn {
				display: block;
				width: 100%;
				text-align: center;
				background: transparent;
				color: var(--paper);
				font-weight: 700;
				font-size: 1.05rem;
				border: 2px solid var(--accent);
				border-radius: 12px;
				padding: 16px;
				margin-top: 22px;
				cursor: pointer;
				font-family: var(--font);
			}

			.pdf-btn:hover,
			.pdf-btn:focus-visible {
				background: rgba(45, 179, 176, 0.15);
			}

			/* ---------- Impresion / PDF ---------- */

			@media print {
				/* No solo el boton de PDF: el de agendar tampoco sirve en papel, ninguno de los
				   dos es "el reporte". */
				.no-print,
				.closing-cta {
					display: none !important;
				}

				.logo-strip {
					-webkit-print-color-adjust: exact;
					print-color-adjust: exact;
				}

				.closing-block {
					-webkit-print-color-adjust: exact;
					print-color-adjust: exact;
				}

				body {
					background: #fff;
				}

				.page-wrap {
					padding: 20px;
				}
			}
		</style>
	</head>
	<body>
		<div class="logo-strip">
			<div class="wrap">
				<img class="logo" src="../assets/logo-loops.png" alt="Loops de Marcas Rentables" />
			</div>
		</div>

		<main class="page-wrap">
			<div class="state" id="loading-state">
				<div class="spinner"></div>
				<p>Cargando tu plan.</p>
			</div>

			<div class="state" id="not-found-state" hidden>
				<p>No encontramos este plan.</p>
				<p class="sub">Revisa que el enlace este completo, o genera uno nuevo en plan.marcasrentables.com.</p>
			</div>

			<div id="report-content" hidden>
				<div id="report-blocks"></div>
				<div class="closing-block" id="closing-block"></div>
			</div>
		</main>

		<script>
			const API_BASE = 'https://growth-advisor-publico.fauadzkassen.workers.dev';

			const params = new URLSearchParams(window.location.search);
			const id = params.get('id');

			const loadingState = document.getElementById('loading-state');
			const notFoundState = document.getElementById('not-found-state');
			const reportContent = document.getElementById('report-content');

			function showNotFound() {
				loadingState.hidden = true;
				notFoundState.hidden = false;
			}

			async function cargarReporte() {
				if (!id) {
					showNotFound();
					return;
				}

				try {
					const response = await fetch(`${API_BASE}/reporte?id=${encodeURIComponent(id)}`);
					if (!response.ok) {
						showNotFound();
						return;
					}
					const data = await response.json();

					const reportBlocks = document.getElementById('report-blocks');
					const closingBlock = document.getElementById('closing-block');
					renderReport(reportBlocks, closingBlock, data.analysis, data.closing, data.moneda, data.tipoCambio);

					// Boton de PDF justo arriba del boton de agendar (el que agrega renderReport).
					const cta = closingBlock.querySelector('.closing-cta');
					const pdfBtn = document.createElement('button');
					pdfBtn.type = 'button';
					pdfBtn.className = 'pdf-btn no-print';
					pdfBtn.textContent = 'Descargar mi plan en PDF';
					pdfBtn.addEventListener('click', () => window.print());
					closingBlock.insertBefore(pdfBtn, cta);

					loadingState.hidden = true;
					reportContent.hidden = false;
				} catch (err) {
					showNotFound();
				}
			}

			cargarReporte();
		</script>
	</body>
</html>
